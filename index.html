
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장세현의 웹페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            text-align: center;
            margin: 0;
            padding: 80px 20px;
        }
        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }
        h1 { color: #333; }
        p { color: #666; }
        button {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h1>안녕하세요!</h1>
        <h2>장세현의 웹페이지</h2>
        <p>전주대학교 인공지능학과</p>
        <hr>

        <h3>자기소개</h3>
        <p>안녕하세요. 인공지능을 공부하고 있는 대학생입니다.</p>

        <h3>관심 분야</h3>
        <p>인공지능 | 머신러닝 | 웹 개발</p>

        <button onclick="hello()">인사하기</button>
        <p id="message"></p>
    </div>

    <script>
        function hello() {
            document.getElementById("message").innerHTML =
                "방문해 주셔서 감사합니다!";
        }
    </script>
</body>
</html>
